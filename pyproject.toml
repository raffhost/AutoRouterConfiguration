[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arctic-router-tool"
version = "1.0.0"
description = "Auto Router Configuration Tool for Teltonika routers"
readme = "README.md"
license = "LicenseRef-ARCTIC-Personal-Use"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
dependencies = [
    "paramiko",
]

[project.scripts]
arctic = "arctic:main"

[tool.setuptools]
py-modules = ["arctic", "router", "config"]